name: Setup JS (pnpm & node)
description: Sets up pnpm & node with dependencies and caching
runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # pnpm/action-setup@v6
      with:
        run_install: false

    - name: Setup node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
      with:
        node-version: '24.22.1'
        cache: pnpm

    - name: Install frontend dependencies
      shell: bash
      run: pnpm install

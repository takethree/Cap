name: Validate pinned GitHub Actions

on:
  pull_request:
  push:
    branches:
      - take-three
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - run: "python3 -m pip install --require-hashes --only-binary=:all: -r scripts/action-pins-requirements.txt"
      - run: python3 scripts/check_action_pins.py

name: "Docker Build Web"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the Docker image"
        required: false
        default: "latest"
        type: string
      publish_ecr:
        description: "Build for Cap production and publish the web image to ECR"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build Docker Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
      fail-fast: false
    permissions:
      contents: read
      packages: write
    env:
      PUBLIC_WEB_URL: ${{ inputs.publish_ecr && 'https://cap.take3tech.dev' || 'http://localhost:3000' }}
      RELEASE_REPOSITORY: ${{ inputs.publish_ecr && github.repository || 'CapSoftware/Cap' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          echo "WEB_URL=${PUBLIC_WEB_URL}" > .env
          echo "NEXT_PUBLIC_DOCKER_BUILD=true" >> .env

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase GITHUB_REPOSITORY_OWNER
        run: |
          echo "REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >>${GITHUB_ENV}

      - name: Build and Push Platform Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_DOCKER_BUILD=true
            NEXT_PUBLIC_WEB_URL=${{ env.PUBLIC_WEB_URL }}
            TAKE3_DESKTOP_RELEASE_REPOSITORY=${{ env.RELEASE_REPOSITORY }}
            TAKE3_DESKTOP_RELEASE_TAG_PREFIX=take3-desktop-
          push: true
          outputs: type=image,name=ghcr.io/${{ env.REPOSITORY_OWNER }}/cap-web,push-by-digest=true
          cache-from: type=gha,scope=buildx-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=buildx-${{ matrix.platform }}

      - name: Export Digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create Multi-Architecture Manifest
    needs: build
    runs-on: ubuntu-latest
    outputs:
      production_image: ${{ steps.manifest.outputs.production_image }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase GITHUB_REPOSITORY_OWNER
        run: |
          echo "REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >>${GITHUB_ENV}

      - name: Create Image Manifest
        id: manifest
        env:
          IMAGE_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          production_image="ghcr.io/${REPOSITORY_OWNER}/cap-web:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create \
            -t "ghcr.io/${REPOSITORY_OWNER}/cap-web:${IMAGE_TAG}" \
            -t "$production_image" \
            $(find /tmp/digests -type f -not -path "*/\.*" -exec basename {} \; | xargs -I {} echo "ghcr.io/${{ env.REPOSITORY_OWNER }}/cap-web@sha256:{}")
          echo "production_image=$production_image" >> "$GITHUB_OUTPUT"

  publish-ecr:
    name: Publish Production Web Image
    if: ${{ inputs.publish_ecr }}
    needs: merge
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::159207264407:role/cap-github-actions-ecr-publisher
          aws-region: us-east-2

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy production image
        env:
          SOURCE_IMAGE: ${{ needs.merge.outputs.production_image }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          skopeo copy --all --preserve-digests \
            --src-authfile "$HOME/.docker/config.json" \
            --dest-authfile "$HOME/.docker/config.json" \
            "docker://${SOURCE_IMAGE}" \
            "docker://${ECR_REGISTRY}/cap-web:sha-${GITHUB_SHA}"

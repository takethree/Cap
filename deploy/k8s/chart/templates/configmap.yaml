{{- $internalEndpoint := .Values.storage.internalEndpoint -}}
{{- if and (not $internalEndpoint) .Values.minio.enabled -}}
{{- $internalEndpoint = printf "http://%s:9000" (include "cap.minioName" .) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cap.configName" . }}
  labels:
    {{- include "cap.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  NODE_ENV: {{ .Values.web.nodeEnv | quote }}
  WEB_URL: {{ .Values.web.publicUrl | quote }}
  NEXTAUTH_URL: {{ default .Values.web.publicUrl .Values.web.nextauthUrl | quote }}
  NEXT_PUBLIC_WEB_URL: {{ .Values.web.publicUrl | quote }}
  NEXT_PUBLIC_DOCKER_BUILD: "true"
  CAP_AWS_BUCKET: {{ .Values.storage.bucket | quote }}
  CAP_AWS_REGION: {{ .Values.storage.region | quote }}
  CAP_S3_BOOTSTRAP: {{ .Values.storage.bootstrap | quote }}
  {{- with .Values.storage.publicEndpoint }}
  S3_PUBLIC_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with $internalEndpoint }}
  S3_INTERNAL_ENDPOINT: {{ . | quote }}
  {{- end }}
  S3_PATH_STYLE: {{ .Values.storage.pathStyle | quote }}
  {{- if .Values.email.provider }}
  EMAIL_PROVIDER: {{ .Values.email.provider | quote }}
  {{- end }}
  {{- if eq .Values.email.provider "smtp" }}
  SMTP_HOST: {{ .Values.email.smtp.host | quote }}
  SMTP_PORT: {{ .Values.email.smtp.port | quote }}
  SMTP_FROM: {{ .Values.email.from | quote }}
  SMTP_SECURE: {{ .Values.email.smtp.secure | quote }}
  SMTP_REQUIRE_TLS: {{ .Values.email.smtp.requireTls | quote }}
  {{- with .Values.email.smtp.messageStream }}
  SMTP_MESSAGE_STREAM: {{ . | quote }}
  {{- end }}
  {{- end }}
  MEDIA_SERVER_URL: {{ printf "http://%s:3456" (include "cap.mediaServerName" .) | quote }}
  MEDIA_SERVER_WEBHOOK_URL: {{ printf "http://%s" (include "cap.webName" .) | quote }}
  CAP_VIDEOS_DEFAULT_PUBLIC: {{ .Values.web.defaultVideosPublic | quote }}
  {{- if .Values.web.allowedSignupDomains }}
  CAP_ALLOWED_SIGNUP_DOMAINS: {{ .Values.web.allowedSignupDomains | quote }}
  {{- end }}
  {{- range $key, $value := .Values.web.configEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

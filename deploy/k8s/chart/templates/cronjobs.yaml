{{- if .Values.cron.staleDesktopSegments.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cap.fullname" . }}-finalize-stale-desktop-segments
  labels:
    {{- include "cap.labels" . | nindent 4 }}
    app.kubernetes.io/component: finalize-stale-desktop-segments
spec:
  schedule: {{ .Values.cron.staleDesktopSegments.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cron.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cron.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cron.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.cron.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "cap.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: finalize-stale-desktop-segments
        spec:
          serviceAccountName: {{ include "cap.serviceAccountName" . }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: Never
          containers:
            - name: cron
              image: "{{ .Values.cron.image.repository }}:{{ .Values.cron.image.tag }}"
              imagePullPolicy: {{ .Values.cron.image.pullPolicy }}
              command:
                - sh
                - -c
                - |
                  curl --fail --silent --show-error --max-time {{ .Values.cron.requestTimeoutSeconds }} -H "Authorization: Bearer ${CRON_SECRET}" "http://{{ include "cap.webName" . }}/api/cron/finalize-stale-desktop-segments"
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "cap.secretName" . }}
                      key: {{ .Values.runtimeSecret.keys.cronSecret }}
              {{- with .Values.cron.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
{{ end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "cap.mediaServerName" . }}
  labels:
    {{- include "cap.labels" . | nindent 4 }}
    app.kubernetes.io/component: media-server
spec:
  type: ClusterIP
  selector:
    {{- include "cap.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: media-server
  ports:
    - name: http
      port: 3456
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cap.mediaServerName" . }}
  labels:
    {{- include "cap.labels" . | nindent 4 }}
    app.kubernetes.io/component: media-server
spec:
  replicas: {{ .Values.mediaServer.replicas }}
  selector:
    matchLabels:
      {{- include "cap.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: media-server
  template:
    metadata:
      labels:
        {{- include "cap.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: media-server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: media-server
          image: "{{ .Values.mediaServer.image.repository }}:{{ .Values.mediaServer.image.tag }}"
          imagePullPolicy: {{ .Values.mediaServer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3456
              protocol: TCP
          env:
            - name: PORT
              value: "3456"
            - name: MEDIA_SERVER_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.mediaServerWebhookSecret }}
            - name: MEDIA_SERVER_MAX_CONCURRENT_VIDEO_PROCESSES
              value: {{ .Values.mediaServer.maxConcurrentVideoProcesses | quote }}
            - name: MEDIA_SERVER_MEMORY_LIMIT_MB
              value: {{ .Values.mediaServer.memoryLimitMb | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mediaServer.resources | nindent 12 }}

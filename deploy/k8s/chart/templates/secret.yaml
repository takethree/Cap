{{- if .Values.runtimeSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cap.secretName" . }}
  labels:
    {{- include "cap.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-secret
type: Opaque
stringData:
  {{ .Values.runtimeSecret.keys.mysqlPassword }}: {{ required "runtimeSecret.values.mysqlPassword is required when runtimeSecret.create=true" .Values.runtimeSecret.values.mysqlPassword | quote }}
  {{ .Values.runtimeSecret.keys.mysqlRootPassword }}: {{ required "runtimeSecret.values.mysqlRootPassword is required when runtimeSecret.create=true" .Values.runtimeSecret.values.mysqlRootPassword | quote }}
  {{ .Values.runtimeSecret.keys.minioRootUser }}: {{ required "runtimeSecret.values.minioRootUser is required when runtimeSecret.create=true" .Values.runtimeSecret.values.minioRootUser | quote }}
  {{ .Values.runtimeSecret.keys.minioRootPassword }}: {{ required "runtimeSecret.values.minioRootPassword is required when runtimeSecret.create=true" .Values.runtimeSecret.values.minioRootPassword | quote }}
  {{ .Values.runtimeSecret.keys.databaseEncryptionKey }}: {{ required "runtimeSecret.values.databaseEncryptionKey is required when runtimeSecret.create=true" .Values.runtimeSecret.values.databaseEncryptionKey | quote }}
  {{ .Values.runtimeSecret.keys.nextauthSecret }}: {{ required "runtimeSecret.values.nextauthSecret is required when runtimeSecret.create=true" .Values.runtimeSecret.values.nextauthSecret | quote }}
  {{ .Values.runtimeSecret.keys.mediaServerWebhookSecret }}: {{ required "runtimeSecret.values.mediaServerWebhookSecret is required when runtimeSecret.create=true" .Values.runtimeSecret.values.mediaServerWebhookSecret | quote }}
{{- end }}

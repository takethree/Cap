{{- $internalEndpoint := .Values.storage.internalEndpoint -}}
{{- if and (not $internalEndpoint) .Values.minio.enabled -}}
{{- $internalEndpoint = printf "http://%s:9000" (include "cap.minioName" .) -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cap.webName" . }}
  labels:
    {{- include "cap.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "cap.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cap.webName" . }}
  labels:
    {{- include "cap.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "cap.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "cap.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "cap.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-dependencies
          image: {{ .Values.web.initImage | quote }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "cap.mysqlName" . }} 3306; do sleep 2; done
              {{- if .Values.minio.enabled }}
              until wget -q --spider http://{{ include "cap.minioName" . }}:9000/minio/health/ready; do sleep 2; done
              {{- end }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.mysqlPassword }}
            - name: DATABASE_URL
              value: {{ printf "mysql://%s:$(MYSQL_PASSWORD)@%s:3306/%s" .Values.mysql.auth.username (include "cap.mysqlName" .) .Values.mysql.auth.database | quote }}
            - name: DATABASE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.databaseEncryptionKey }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.nextauthSecret }}
            - name: MEDIA_SERVER_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.mediaServerWebhookSecret }}
            {{- if .Values.providerKeys.enabled }}
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.deepgramApiKey }}
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.groqApiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.openaiApiKey }}
            - name: REPLICATE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.replicateApiToken }}
            {{- end }}
            {{- if .Values.workflow.enabled }}
            - name: WORKFLOW_TARGET_WORLD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.workflowTargetWorld }}
            - name: WORKFLOW_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.workflowPostgresUrl }}
            - name: WORKFLOW_POSTGRES_JOB_PREFIX
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.workflowPostgresJobPrefix }}
            {{- end }}
            {{- if or .Values.cron.staleDesktopSegments.enabled .Values.cron.developerStorage.enabled }}
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.cronSecret }}
            {{- end }}
            {{- if .Values.minio.enabled }}
            - name: CAP_AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.minioRootUser }}
            - name: CAP_AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.minioRootPassword }}
            {{- end }}
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: NODE_ENV
            - name: WEB_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: WEB_URL
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: NEXTAUTH_URL
            - name: NEXT_PUBLIC_WEB_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: NEXT_PUBLIC_WEB_URL
            - name: NEXT_PUBLIC_DOCKER_BUILD
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: NEXT_PUBLIC_DOCKER_BUILD
            - name: CAP_AWS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: CAP_AWS_BUCKET
            - name: CAP_AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: CAP_AWS_REGION
            - name: CAP_S3_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: CAP_S3_BOOTSTRAP
            {{- with .Values.storage.publicEndpoint }}
            - name: S3_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: S3_PUBLIC_ENDPOINT
            {{- end }}
            {{- with $internalEndpoint }}
            - name: S3_INTERNAL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: S3_INTERNAL_ENDPOINT
            {{- end }}
            - name: S3_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: S3_PATH_STYLE
            {{- if .Values.email.provider }}
            - name: EMAIL_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: EMAIL_PROVIDER
            {{- end }}
            {{- if eq .Values.email.provider "smtp" }}
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: SMTP_PORT
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: SMTP_FROM
            - name: SMTP_SECURE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: SMTP_SECURE
            - name: SMTP_REQUIRE_TLS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: SMTP_REQUIRE_TLS
            {{- with .Values.email.smtp.messageStream }}
            - name: SMTP_MESSAGE_STREAM
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" $ }}
                  key: SMTP_MESSAGE_STREAM
            {{- end }}
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.smtpUsername }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.secretName" . }}
                  key: {{ .Values.runtimeSecret.keys.smtpPassword }}
            {{- end }}
            - name: MEDIA_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: MEDIA_SERVER_URL
            - name: MEDIA_SERVER_WEBHOOK_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: MEDIA_SERVER_WEBHOOK_URL
            - name: CAP_VIDEOS_DEFAULT_PUBLIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: CAP_VIDEOS_DEFAULT_PUBLIC
            {{- if .Values.web.allowedSignupDomains }}
            - name: CAP_ALLOWED_SIGNUP_DOMAINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cap.configName" . }}
                  key: CAP_ALLOWED_SIGNUP_DOMAINS
            {{- end }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1001

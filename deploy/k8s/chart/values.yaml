nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

runtimeSecret:
  create: false
  name: cap-runtime
  keys:
    mysqlPassword: mysql-password
    mysqlRootPassword: mysql-root-password
    minioRootUser: minio-root-user
    minioRootPassword: minio-root-password
    databaseEncryptionKey: database-encryption-key
    nextauthSecret: nextauth-secret
    mediaServerWebhookSecret: media-server-webhook-secret
    smtpUsername: smtp-username
    smtpPassword: smtp-password
    openaiApiKey: openai-api-key
    groqApiKey: groq-api-key
    deepgramApiKey: deepgram-api-key
    replicateApiToken: replicate-api-token
    workflowTargetWorld: workflow-target-world
    workflowPostgresUrl: workflow-postgres-url
    workflowPostgresJobPrefix: workflow-postgres-job-prefix
    cronSecret: cron-secret
  values:
    mysqlPassword: ""
    mysqlRootPassword: ""
    minioRootUser: ""
    minioRootPassword: ""
    databaseEncryptionKey: ""
    nextauthSecret: ""
    mediaServerWebhookSecret: ""
    smtpUsername: ""
    smtpPassword: ""
    openaiApiKey: ""
    groqApiKey: ""
    deepgramApiKey: ""
    replicateApiToken: ""
    workflowTargetWorld: ""
    workflowPostgresUrl: ""
    workflowPostgresJobPrefix: ""
    cronSecret: ""

providerKeys:
  enabled: false

workflow:
  enabled: false
  setup:
    enabled: true
    backoffLimit: 3
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 86400
    resources: {}

cron:
  image:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent
  requestTimeoutSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  activeDeadlineSeconds: 180
  resources: {}
  staleDesktopSegments:
    enabled: false
    schedule: "*/15 * * * *"
  developerStorage:
    enabled: false
    schedule: "5 0 * * *"

storage:
  bucket: cap
  region: us-east-1
  publicEndpoint: http://localhost:9000
  internalEndpoint: ""
  pathStyle: "true"
  bootstrap: "true"

email:
  provider: ""
  from: ""
  smtp:
    host: ""
    port: "587"
    secure: "false"
    requireTls: "true"
    messageStream: ""

web:
  replicas: 1
  image:
    repository: ghcr.io/capsoftware/cap-web
    tag: latest
    pullPolicy: IfNotPresent
  publicUrl: http://localhost:3000
  nextauthUrl: ""
  nodeEnv: production
  defaultVideosPublic: "true"
  allowedSignupDomains: ""
  initImage: busybox:1.36
  configEnv: {}
  extraEnv: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

mediaServer:
  replicas: 1
  image:
    repository: ghcr.io/capsoftware/cap-media-server
    tag: latest
    pullPolicy: IfNotPresent
  maxConcurrentVideoProcesses: "2"
  memoryLimitMb: "1536"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  auth:
    database: cap
    username: cap
  persistence:
    storageClassName: gp3
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

minio:
  enabled: true
  image:
    repository: minio/minio
    tag: latest
    pullPolicy: IfNotPresent
  persistence:
    storageClassName: gp3
    size: 100Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

ingress:
  enabled: true
  className: haproxy
  webHost: cap.local
  s3Host: cap-s3.local
  annotations:
    kubernetes.io/ingress.class: haproxy
    haproxy.org/check: "false"
    haproxy.org/load-balance: leastconn
    haproxy.org/request-body-size: "10737418240"
    haproxy.org/timeout-client: 3600s
    haproxy.org/timeout-http-request: 120s
    haproxy.org/timeout-server: 3600s
    haproxy.org/timeout-tunnel: 3600s
